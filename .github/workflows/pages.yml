# Builds the game's single HTML file from source and publishes it on GitHub Pages as index.html.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      # The build uses only Node built-ins; no npm install needed.
      - name: Build the HTML
        run: |
          # The website build (the single 249 MB file crashed iPhones): a small index.html with its images,
          # sounds and fonts as separate files in _site/a. The release zip keeps the single offline file.
          node build/build.cjs --web _site
          # The scoreboard page (site/scores) with its paper and tape, the lettered titles, its heading, the Esc keycap, the ink underline and two fonts.
          mkdir -p _site/scores/titles _site/scores/fonts _site/scores/ui
          cp assets/ui/headings/scoreboard.webp assets/ui/key.webp assets/ui/ink-underline.webp _site/scores/ui/
          # Each page its own tab badge: the game a yellow 2, the scoreboard a red trophy, the stats blue bars.
          cp assets/arcade/page/icon-scores.ico _site/scores/ui/icon.ico
          cp site/scores/index.html _site/scores/
          # The play stats page: one file.
          mkdir -p _site/stats && cp site/stats/index.html site/stats/*.webp site/stats/world.json _site/stats/
          cp assets/arcade/page/icon-stats.ico _site/stats/icon.ico
          cp site/scores/ui/*.webp _site/scores/ui/
          cp assets/ui/titles/*.webp _site/scores/titles/
          cp assets/arcade/v044/fonts/PatrickHand-Regular.ttf assets/arcade/v044/fonts/PermanentMarker-Regular.ttf _site/scores/fonts/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
        with:
          # About 1,860 asset files: GitHub's file sync can take longer than the 10-minute default (2026-11-06).
          timeout: 1800000
